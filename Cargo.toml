[package]
name = "stratum"
version = "0.1.0"
edition = "2024"

# Lint policy: warn in source, `-D warnings` in CI. Pedantic is selected, not the
# whole group — the group's style opinions would drown the ones that catch bugs.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
needless_collect = "warn"
manual_let_else = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_wraps = "warn"
semicolon_if_nothing_returned = "warn"
items_after_statements = "warn"

# Deployable binary: LTO + one codegen unit for the daemon's inner loops, strip
# to keep the on-disk binary small. `panic` stays unwind so a panic in one place
# still leaves a readable backtrace in the LaunchAgent log.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[dependencies]
fontdue = "0.9.5"
resvg = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
toml = "1.2.1"
usvg = "0.50.0"

# Live (on-screen) presenter. The core stays portable: these are only pulled
# in on macOS, and src/live.rs is cfg(target_os = "macos").
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSBitmapImageRep",
  "NSColor",
  "NSGraphics",
  "NSImageRep",
  "NSResponder",
  "NSEvent",
  "NSScreen",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDate", "NSDictionary", "NSRunLoop", "NSString"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CATransaction"] }
